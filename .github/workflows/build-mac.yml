name: Build macOS

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm exec electron-rebuild -f

      - name: Build macOS
        run: pnpm build:mac:dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## macOS

            > ⚠️ macOS shows "`MarkText is damaged and can't be opened`" due to lack of code signing.

            **Fix:** Run in Terminal after downloading:
            ```bash
            xattr -cr /Applications/marktext.app
            ```
